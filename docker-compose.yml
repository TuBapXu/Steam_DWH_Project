services:
  mage:
    build: .
    command: ["/bin/sh", "-c", "python /home/src/database_setup/bootstrap.py && exec /app/run_app.sh"]
    ports:
      - "${STEAM_MAGE_PORT:-6790}:6789"
    volumes:
      - .:/home/src/
    environment:
      - USER_CODE_PATH=/home/src/mage_pipeline
      - MSSQL_PASSWORD=${MSSQL_PASSWORD:?Set MSSQL_PASSWORD in .env}
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:db9a8fe3098b7e8bbde41106bdc7caee942e97124e5fdb71b872ca208de3092d
    ports:
      - "1435:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD:?Set MSSQL_PASSWORD in .env}
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_data:/var/opt/mssql

  dbt:
    build:
      context: .
      dockerfile: dbt_transform/Dockerfile
    profiles: ["transform"]
    working_dir: /workspace/dbt_transform
    volumes:
      - .:/workspace
    env_file: .env
    environment:
      DBT_PROFILES_DIR: /workspace/dbt_transform
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    depends_on:
      - sqlserver
    entrypoint: ["dbt"]
    command: ["--version"]

volumes:
  sqlserver_data:
