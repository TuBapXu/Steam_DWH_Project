steam_dwh:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: sqlserver
      driver: "{{ env_var('MSSQL_DRIVER', 'ODBC Driver 18 for SQL Server') }}"
      server: "{{ env_var('MSSQL_HOST', 'sqlserver') }}"
      port: "{{ env_var('MSSQL_PORT', '1433') | int }}"
      database: "{{ env_var('DWH_DATABASE', 'steam_games_DWH') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'dbt_staging') }}"
      user: "{{ env_var('MSSQL_USER', 'sa') }}"
      password: "{{ env_var('MSSQL_PASSWORD') }}"
      encrypt: true
      trust_cert: true
      threads: 1
    local:
      type: sqlserver
      driver: "{{ env_var('MSSQL_DRIVER', 'ODBC Driver 18 for SQL Server') }}"
      server: "{{ env_var('MSSQL_LOCAL_HOST', 'localhost') }}"
      port: "{{ env_var('MSSQL_LOCAL_PORT', '1435') | int }}"
      database: "{{ env_var('DWH_DATABASE', 'steam_games_DWH') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'dbt_staging') }}"
      user: "{{ env_var('MSSQL_USER', 'sa') }}"
      password: "{{ env_var('MSSQL_PASSWORD') }}"
      encrypt: true
      trust_cert: true
      threads: 1
